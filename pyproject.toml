[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quant-futures"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "pandas>=2.0",
    "numpy>=1.26",
    "polars>=0.20",
    "ib-insync>=0.9.86",
    "pyyaml>=6.0",
    "lightgbm>=4.0",
    "scikit-learn>=1.3",
    "plotly>=5.0",
    "rich>=13.0",
    "aiohttp>=3.9",
    "pandas-market-calendars>=4.3",
    "tqdm>=4.65",
    "yfinance>=0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "hypothesis>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/quant"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
ignore = [
    "N803",   # ML convention: X, T, D as argument names
    "N806",   # ML convention: X, T, D as variable names
    "N815",   # ML convention: seq_lookback_T mixed-case config field
    "B904",   # raise-without-from-cause — acceptable in this codebase
    "SIM102", # nested if — readability preference
    "SIM103", # return condition directly — readability preference
    "SIM105", # contextlib.suppress — readability preference
    "SIM108", # ternary operator — readability preference
    "SIM110", # any() comprehension — readability preference
    "UP042",  # StrEnum — keep str+Enum for Pydantic compatibility
    "E501",   # line too long — overly strict for this codebase
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
# strict = true intentionally disabled — gradual typing adoption

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"
pythonpath = ["src"]

